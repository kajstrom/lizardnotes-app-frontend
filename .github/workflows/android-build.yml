name: Android Build

on:
  # Manual runs. Only master can reach AWS — see the guard step below.
  workflow_dispatch:
  # Called by the Deploy workflow after the tests pass on master, so the build
  # steps live in one place rather than being duplicated there.
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The deploy role trusts only refs/heads/master, so a dispatch from any
      # other branch cannot assume it. Without this the run gets three steps in
      # and dies inside configure-aws-credentials with an opaque OIDC "not
      # authorized to perform sts:AssumeRoleWithWebIdentity" error. Fail here
      # instead, naming the actual cause.
      - name: Enforce master-only dispatch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/master'
        run: |
          echo "::error::Android Build can only be dispatched from master (got ${{ github.ref }})."
          echo "The deploy role's trust policy allows refs/heads/master only."
          echo "See the Credentials section of README.md."
          exit 1

      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch build config
        uses: ./.github/actions/fetch-config
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: flutter build apk
        run: |
          flutter build apk --debug \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL="$API_URL" \
            --dart-define=COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" \
            --dart-define=COGNITO_APP_CLIENT_ID="$COGNITO_APP_CLIENT_ID"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lizardnotes-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
