name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Builds the debug APK and uploads it as a run artifact. Runs alongside the
  # web deploy rather than gating it: a broken APK should not block shipping
  # the web app, and the failure is still visible on the run.
  android:
    needs: [test]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/android-build.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Fetch build config
        uses: ./.github/actions/fetch-config
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read web deploy targets
        run: |
          fetch() {
            local val
            val=$(aws ssm get-parameter --name "$1" \
              --query Parameter.Value --output text)
            if [[ -z "$val" ]]; then
              echo "ERROR: SSM parameter $1 returned empty" >&2
              exit 1
            fi
            echo "$val"
          }
          echo "BUCKET_NAME=$(fetch /lizardnotes/frontend/bucketName)" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=$(fetch /lizardnotes/frontend/distributionId)" >> $GITHUB_ENV

      - name: flutter build web
        run: |
          flutter build web --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" \
            --dart-define=COGNITO_APP_CLIENT_ID="$COGNITO_APP_CLIENT_ID"

      - name: Sync to S3
        run: |
          aws s3 sync build/web/ s3://$BUCKET_NAME \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

          for f in index.html flutter_service_worker.js flutter_bootstrap.js flutter.js main.dart.js manifest.json version.json; do
            if [ -f "build/web/$f" ]; then
              case "$f" in
                *.json) ct="application/json" ;;
                *.js)   ct="application/javascript" ;;
                *.html) ct="text/html" ;;
              esac
              aws s3 cp "build/web/$f" "s3://$BUCKET_NAME/$f" \
                --cache-control "no-cache,no-store,must-revalidate" \
                --content-type "$ct"
            fi
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

      - name: Confirm deployment
        run: echo "Deployed to https://lizardnotes.kstrm.com"
